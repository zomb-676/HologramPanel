plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'org.jetbrains.kotlin.jvm' version '2.3.20'
    id 'me.modmuss50.mod-publish-plugin' version '1.1.0'
}

version = "$minecraft_version-$platform_name-$mod_version"
group = mod_group_id

repositories {
    mavenLocal()
    maven {
        url 'https://www.cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
    maven {
        url 'https://maven.shedaniel.me'
    }
    maven {
        name 'IzzelAliz Maven'
        url 'https://maven.izzel.io/releases/'
    }
    maven {
        name "Jared's maven"
        url 'https://maven.blamejared.com/'
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

kotlin {
    compilerOptions {
        freeCompilerArgs.add('-Xcontext-parameters')
    }
}

neoForge {
    version = project.neo_version

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            client()

            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        client2 {
            client()

            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            programArguments.add('--username=Dev2')
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            jvmArguments.add('-Dmixin.debug=true')
            jvmArguments.add('-Dmixin.debug.export=true')

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // mostly optional in a single mod project
        // but multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude('**/*.bbmodel') // BlockBench project files
    exclude('src/generated/**/.cache') // datagen cache files
}
sourceSets.main.java { srcDir('src/main/kotlin') }

Closure<ModuleDependency> modernUIExcludes = { ModuleDependency dep ->
    dep.exclude group: 'org.slf4j', module: 'slf4j-api'
    dep.exclude group: 'org.apache.logging.log4j', module: 'log4j-core'
    dep.exclude group: 'org.apache.logging.log4j', module: 'log4j-api'
    dep.exclude group: 'com.google.code.findbugs', module: 'jsr305'
    dep.exclude group: 'org.jetbrains', module: 'annotations'
    dep.exclude group: 'com.ibm.icu', module: 'icu4j'
    dep.exclude group: 'it.unimi.dsi', module: 'fastutil'
}

dependencies {// TODO: Use localRuntime?
    jarJar(implementation('org.jetbrains.kotlin:kotlin-stdlib:2.3.20'))

    runtimeOnly("curse.maven:jade-324717:7817285")
//    implementation("me.shedaniel:RoughlyEnoughItems-neoforge:18.0.800")// FIXME: Wait for REI update

    //compileOnly("mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}")
    //runtimeOnly("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")

    runtimeOnly("icyllis.modernui:ModernUI-Core:${modernui_core_version}", modernUIExcludes)
    runtimeOnly("icyllis.modernui:ModernUI-Markflow:${modernui_core_version}", modernUIExcludes)
//    runtimeOnly "icyllis.modernui:ModernUI-NeoForge:${minecraft_version}-${modernui_core_version}"// FIXME: Wait for ModernUI update
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

publishMods {
    file = jar.archiveFile
    changelog = "# Markdown changelog content"
    type = STABLE

    def name = "$mod_name".replace(" ", "")
    displayName = "${name} ${project.version}"

    modLoaders.add("$platform_name")

    curseforge {
        accessToken = providers.environmentVariable("CURSE_FORGE_TOKEN")
        projectId = "1234869"
        minecraftVersions.add("$minecraft_version")

        javaVersions.add(JavaVersion.VERSION_25)

        clientRequired = true
        serverRequired = true
    }

    modrinth {
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        projectId = "BGwc3Y3t"
        minecraftVersions.add("$minecraft_version")
    }
}
